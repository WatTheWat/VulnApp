# Neil and Avi's Coffee Shop — deliberately vulnerable demo stack.
# DO NOT expose this to the internet. Lock the NSG to your own IP.

services:

  suricata-responder:
    build: ./suricata-responder
    container_name: suricata-responder
    restart: unless-stopped
    env_file: ./suricata-responder/.env
    volumes:
      - ./suricata-responder/logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  #Web appplication firewall - OWASP
  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    ports:
      - "80:8080"            # listens on 8080 internally
    environment:
      BACKEND: http://web:80
      MODSEC_RULE_ENGINE: DetectionOnly   # log, don't block (Act 1 must succeed)
      BLOCKING_PARANOIA: 1
      MODSEC_AUDIT_LOG: /var/log/modsec/audit.log
      MODSEC_AUDIT_LOG_FORMAT: JSON
    volumes:
      - ./logs/modsec:/var/log/modsec
    depends_on:
      - web


  web:
    image: nginx:1.27-alpine
    volumes:
      - ./app:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - php
    restart: unless-stopped

  php:
    build: ./php
    volumes:
      - ./app:/var/www/html:ro
    environment:
      DB_HOST: db
      DB_NAME: coffeeshop
      DB_USER: coffee
      DB_PASS: ${DB_PASS:-brewmaster-2026}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root-roast-2026}
      MYSQL_DATABASE: coffeeshop
      MYSQL_USER: coffee
      MYSQL_PASSWORD: ${DB_PASS:-brewmaster-2026}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASS:-root-roast-2026}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  db_data:
